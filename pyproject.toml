[project]
name = "country-guess"
version = "0.1.0"
description = "A country-shape guessing web app and model development project"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
web = [
    "flask>=3.1,<4",
    "requests>=2.32,<3",
    "shapely>=2,<3",
]

ml = [
    "flask>=3.1,<4",
    "geopandas>=1,<2",
    "matplotlib>=3.3",
    "mlflow-skinny==2.17.0",
    "numpy<2",
    "pandas>=2,<3",
    "requests>=2.32,<3",
    "scikit-image>=0.24,<1",
    "shapely>=2,<3",
    "torch==2.5.1",
]

training = [
    {include-group = "ml"},
    "imgaug>=0.4,<1",
    "jupyterlab>=4,<5",
    "shapelysmooth>=0.2,<1",
]

app = [
    {include-group = "web"},
    {include-group = "ml"},
]

test = [
    {include-group = "app"},
]

[tool.uv]
package = false
required-version = ">=0.12.1,<0.13"
python-preference = "system"
