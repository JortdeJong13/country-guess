name: end-to-end test

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "countryguess/**"
      - "mlserver/**"
      - "webapp/**"
      - "drawingstore/**"
      - "tests/data/**"
      - "tests/e2e_services.py"
      - "tests/test_e2e.py"
      - "tests/test_admin_e2e.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Justfile"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --only-group app

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: drawingstore/go.mod
          cache: true

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d postgres \
            -c "ALTER USER postgres WITH PASSWORD 'postgres';"

      - name: Run end-to-end tests
        run: uv run --locked --no-sync python -m unittest discover tests -v
        env:
          TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
